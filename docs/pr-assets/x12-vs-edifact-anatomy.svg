<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="Where the segment code, qualifier and data live in X12 versus EDIFACT">
  <defs>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0E6E6E"/></marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#B3403A"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="468" rx="12" fill="#FFFFFF" stroke="#C9D4DC"/>

  <text x="24" y="38" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1F2933">X12 — one separator ( * ): the qualifier is a whole field</text>

  <rect x="24" y="58" width="54" height="36" rx="5" fill="#EAEEF2" stroke="#C9D4DC"/>
  <text x="51" y="82" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#1F2933">REF</text>
  <text x="88" y="82" font-family="Menlo,Consolas,monospace" font-size="15" fill="#8A99A8">*</text>
  <rect x="104" y="58" width="44" height="36" rx="5" fill="#DCEBE9" stroke="#0E6E6E"/>
  <text x="126" y="82" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#0A5A5A">1L</text>
  <text x="156" y="82" font-family="Menlo,Consolas,monospace" font-size="15" fill="#8A99A8">*</text>
  <rect x="172" y="58" width="56" height="36" rx="5" fill="#EAEEF2" stroke="#C9D4DC"/>
  <text x="200" y="82" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#1F2933">373</text>
  <text x="236" y="82" font-family="Menlo,Consolas,monospace" font-size="15" fill="#8A99A8">~</text>

  <line x1="51" y1="96" x2="51" y2="108" stroke="#8A99A8"/>
  <text x="51" y="124" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5C6B79">segment code</text>
  <line x1="126" y1="96" x2="126" y2="138" stroke="#0E6E6E"/>
  <text x="126" y="154" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0E6E6E">field 1 — the QUALIFIER</text>
  <line x1="200" y1="96" x2="200" y2="108" stroke="#8A99A8"/>
  <text x="200" y="124" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5C6B79">field 2 — the data</text>

  <text x="420" y="55" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0E6E6E">a rule can point at a whole field ✓</text>
  <path d="M412 50 L180 50 Q 150 50 138 55" fill="none" stroke="#0E6E6E" stroke-width="1.6" marker-end="url(#aA)"/>

  <line x1="24" y1="182" x2="736" y2="182" stroke="#C9D4DC" stroke-dasharray="5 4"/>

  <text x="24" y="216" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1F2933">EDIFACT — two separators ( + then : ): the qualifier is INSIDE a composite field</text>

  <rect x="24" y="236" width="54" height="36" rx="5" fill="#EAEEF2" stroke="#C9D4DC"/>
  <text x="51" y="260" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" font-weight="700" fill="#1F2933">RFF</text>
  <text x="88" y="260" font-family="Menlo,Consolas,monospace" font-size="15" fill="#8A99A8">+</text>
  <rect x="104" y="236" width="232" height="36" rx="5" fill="#EAEEF2" stroke="#C9D4DC"/>
  <text x="220" y="260" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#1F2933">VA:SE556421030901</text>
  <text x="344" y="260" font-family="Menlo,Consolas,monospace" font-size="15" fill="#8A99A8">'</text>

  <text x="366" y="261" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5C6B79">← field 1 — one composite value (a sealed box)</text>

  <text x="420" y="302" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#B3403A">a rule that can only name whole fields</text>
  <text x="420" y="320" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#B3403A">stops at the box — it can't reach inside ✗</text>
  <line x1="414" y1="306" x2="342" y2="262" stroke="#B3403A" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#aR)"/>

  <line x1="150" y1="272" x2="132" y2="322" stroke="#8A99A8"/>
  <line x1="268" y1="272" x2="258" y2="322" stroke="#8A99A8"/>
  <text x="176" y="302" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-style="italic" fill="#5C6B79">cut again at " : "</text>

  <rect x="106" y="322" width="48" height="34" rx="5" fill="#DCEBE9" stroke="#0E6E6E"/>
  <text x="130" y="344" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" font-weight="700" fill="#0A5A5A">VA</text>
  <rect x="166" y="322" width="196" height="34" rx="5" fill="#EAEEF2" stroke="#C9D4DC"/>
  <text x="264" y="344" text-anchor="middle" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#1F2933">SE556421030901</text>

  <line x1="130" y1="356" x2="130" y2="368" stroke="#0E6E6E"/>
  <text x="130" y="384" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#0E6E6E">component 1 — the QUALIFIER</text>
  <line x1="264" y1="356" x2="264" y2="394" stroke="#8A99A8"/>
  <text x="264" y="410" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#5C6B79">component 2 — the data</text>

  <text x="24" y="446" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C6B79">This is why the new rule attaches to the element itself — a field, a component, or a sub-component — at whatever depth the value lives.</text>
</svg>
