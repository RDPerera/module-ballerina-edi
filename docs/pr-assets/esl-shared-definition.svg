<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 312" width="760" height="312" role="img" aria-label="ESL and EDIFACT generated schemas define each segment once and reference it from many positions, so a rule on the definition cannot differ per position">
  <defs>
    <marker id="aM" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5C6B79"/></marker>
  </defs>
  <rect x="1" y="1" width="758" height="310" rx="12" fill="#FFFFFF" stroke="#C9D4DC"/>

  <text x="24" y="36" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1F2933">ESL / EDIFACT-generated schemas — one shared definition, many positions</text>

  <text x="24" y="66" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1" fill="#5C6B79">SEGMENTDEFINITIONS</text>
  <rect x="24" y="76" width="304" height="140" rx="10" fill="#F4F6F8" stroke="#C9D4DC"/>
  <text x="40" y="102" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#1F2933">segment "RFF" — defined ONCE</text>
  <text x="40" y="126" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#5C6B79">field 1: composite</text>
  <rect x="40" y="136" width="256" height="28" rx="5" fill="#DCEBE9" stroke="#0E6E6E"/>
  <text x="50" y="155" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" font-weight="700" fill="#0A5A5A">component 1: the QUALIFIER</text>
  <text x="40" y="192" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12.5" fill="#5C6B79">component 2: the data</text>

  <text x="452" y="66" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="11" letter-spacing="1" fill="#5C6B79">SEGMENTS (POSITIONS IN THE MESSAGE)</text>
  <rect x="452" y="76" width="152" height="30" rx="5" fill="#EAEEF2" stroke="#C9D4DC"/>
  <text x="462" y="96" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#1F2933">{ "ref": "RFF" }</text>
  <text x="614" y="96" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C6B79">expects qualifier SS</text>
  <rect x="452" y="120" width="152" height="30" rx="5" fill="#EAEEF2" stroke="#C9D4DC"/>
  <text x="462" y="140" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#1F2933">{ "ref": "RFF" }</text>
  <text x="614" y="140" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C6B79">expects qualifier VA</text>
  <rect x="452" y="164" width="152" height="30" rx="5" fill="#EAEEF2" stroke="#C9D4DC"/>
  <text x="462" y="184" font-family="Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="12" fill="#1F2933">{ "ref": "RFF" }</text>
  <text x="614" y="184" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#5C6B79">expects qualifier ON</text>

  <path d="M448 91 C 400 91, 380 128, 332 136" fill="none" stroke="#5C6B79" stroke-width="1.5" marker-end="url(#aM)"/>
  <path d="M448 135 C 410 135, 372 143, 332 145" fill="none" stroke="#5C6B79" stroke-width="1.5" marker-end="url(#aM)"/>
  <path d="M448 179 C 400 179, 380 162, 332 154" fill="none" stroke="#5C6B79" stroke-width="1.5" marker-end="url(#aM)"/>

  <text x="380" y="254" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#B3403A">one definition can hold only ONE rule — but the three positions need three different qualifiers ✗</text>
  <text x="380" y="282" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#0E6E6E">the fix: make a narrowed copy of the definition per meaning and reference the copy ✓</text>
</svg>
